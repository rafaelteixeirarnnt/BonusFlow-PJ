spring:
  application:
    name: bonusflow-pj-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bonusflow}
    username: ${SPRING_DATASOURCE_USERNAME:bonusflow}
    password: ${SPRING_DATASOURCE_PASSWORD:bonusflow}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${APP_JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
    jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:10}
