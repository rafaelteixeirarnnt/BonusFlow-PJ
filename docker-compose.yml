services:
  postgres:
    image: postgres:16-alpine
    container_name: bonusflow-postgres
    environment:
      POSTGRES_DB: bonusflow
      POSTGRES_USER: bonusflow
      POSTGRES_PASSWORD: bonusflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonusflow -d bonusflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: bonusflow-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bonusflow
      SPRING_DATASOURCE_USERNAME: bonusflow
      SPRING_DATASOURCE_PASSWORD: bonusflow
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_FRONTEND_URL: http://localhost:5173
      APP_JWT_SECRET: local-dev-secret-change-me-local-dev-secret-change-me
      APP_JWT_EXPIRATION_MINUTES: 10
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: bonusflow-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
